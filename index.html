      // Saved colour theme, painted before the app loads (written by src/services/appearance.ts).
      try {
        var saved = JSON.parse(localStorage.getItem('pq.appearance') || 'null');
        if (saved && saved.vars) {
          var root = document.documentElement;
          root.dataset.theme = saved.theme;
          root.dataset.palette = saved.palette;
          root.dataset.hero = saved.hero;
          for (var name in saved.vars) root.style.setProperty(name, saved.vars[name]);
        }
      } catch (e) {}
