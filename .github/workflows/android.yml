# Android builds (Capacitor). Produces:
#   - app-debug.apk               always (installable, signed with the shared debug key)
#   - app-release.apk / .aab      signed, when the signing secrets below are set
#   - app-release-unsigned.apk    otherwise (must be signed before installing)
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file (base64 -w0 polyglot-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See docs/ANDROID_BUILD.md.
#
# On pushes the newest installable APK is also published as the GitHub release
# "android-latest", so phones can download it from one permanent link:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/polyglot-quest.apk
name: Android

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publishes the APK as the release "android-latest"
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Explicit, minimal packages (v3 of this action defaulted to the obsolete
      # "tools" package, which current cmdline-tools no longer provide). The
      # Android Gradle Plugin downloads the build-tools version it needs.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      - name: Build web bundle and sync Capacitor
        run: npm run cap:sync

      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: building an unsigned release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: List outputs
        run: find android/app/build/outputs -name '*.apk' -o -name '*.aab' | xargs ls -l

      - uses: actions/upload-artifact@v6
        with:
          name: polyglot-quest-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: polyglot-quest-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish the APK (release "android-latest")
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk polyglot-quest.apk
            kind="podpisana wersja produkcyjna"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk polyglot-quest.apk
            kind="wersja testowa (debug), podpisana publicznym kluczem z repozytorium"
          fi
          notes="Najnowsza aplikacja Polyglot Quest na Androida: ${kind}.
          Zbudowana automatycznie z commita ${GITHUB_SHA::7} (gałąź ${GITHUB_REF_NAME}, build ${VERSION_CODE}).

          Instalacja: otwórz ten link na telefonie, pobierz plik polyglot-quest.apk i otwórz go.
          Przy pierwszej instalacji Android zapyta o zgodę na instalowanie aplikacji z przeglądarki.
          Kolejne wersje instalują się na poprzednią i zachowują postępy.
          Instrukcja: INSTALACJA.md w repozytorium."
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest polyglot-quest.apk \
            --title "Polyglot Quest na Androida (najnowsza wersja)" \
            --notes "$notes" --target "$GITHUB_SHA" --latest
