# Web checks: lint, types, unit tests, production build and Playwright E2E
# (phone + tablet viewports). Runs on every push and pull request.
# On pushes and manual runs ("Run workflow", e.g. after changing repository variables such as
# GOOGLE_CLIENT_ID), the tested build is published to GitHub Pages, whichever source the repository
# uses (the gh-pages branch or "GitHub Actions"): https://<owner>.github.io/<repo>/
# (see INSTALACJA.md)
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # publishes the tested build to the gh-pages branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Google sign-in for the Drive copy (docs/CLOUD_SYNC.md). An OAuth client id is public;
          # set it as the repository variable GOOGLE_CLIENT_ID (Settings → Secrets and variables
          # → Actions → Variables). Empty = the account features stay hidden.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # Role ids (not secrets) of the developer and admin accounts: docs/DEVELOPER_ACCESS.md.
          VITE_DEVELOPER_ACCOUNTS: ${{ vars.DEVELOPER_ACCOUNT_IDS }}
          VITE_ADMIN_ACCOUNTS: ${{ vars.ADMIN_ACCOUNT_IDS }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # Only a build that passed every check above is published. Relative paths and hash
      # routing let the app run from the /<repo>/ subfolder of GitHub Pages.
      - name: Publish the web app (GitHub Pages)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="$RUNNER_TEMP/site"
          cp -r dist "$site"
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # The same build as a Pages artifact, for repositories whose Pages source is "GitHub Actions".
      - name: Package the web app for GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # GitHub Pages can publish either the gh-pages branch (pushed above) or an artifact deployed
  # from a workflow. This job reads which source the repository uses and deploys the artifact
  # when the source is "GitHub Actions".
  pages:
    needs: web
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Read the GitHub Pages settings
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null || echo '{}')
          echo "$config" | jq '{status, build_type, source, html_url}'
          echo "build_type=$(echo "$config" | jq -r '.build_type // "none"')" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.config.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4
